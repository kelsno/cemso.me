<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cemso.me — photography</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #666666;
            font-family: "Helvetica Neue", Helvetica, "Hiragino Kaku Gothic ProN", "Yu Gothic", Arial, sans-serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            padding: 24px 20px;
        }

        .wrapper {
            width: 780px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 13.5px;
            letter-spacing: -0.02em;
        }

        .nav-left {
            display: flex;
            gap: 20px;
        }

        html[lang="ja"] .nav-left {
            gap: 14px;
        }

        .nav-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        nav a {
            text-decoration: none;
            color: #b5b5b5;
            font-weight: 400;
            transition: color 0.15s ease;
        }

        nav a:hover,
        nav a.active {
            color: #666666;
        }

        .lang-switcher {
            margin-top: 4px;
            font-size: 9.5px;
            letter-spacing: 0.01em;
            color: #cccccc;
            line-height: 1.2;
        }

        .lang-btn {
            background: none;
            border: none;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, "Hiragino Kaku Gothic ProN", "Yu Gothic", Arial, sans-serif;
            font-size: 9.5px;
            color: #b5b5b5;
            cursor: pointer;
            letter-spacing: -0.01em;
            transition: color 0.15s ease;
        }

        .lang-btn:hover {
            color: #666666;
        }

        .lang-btn.active {
            color: #ef5a28;
            font-weight: 700;
        }

        .lang-sep {
            margin: 0 3px;
            color: #cccccc;
        }

        h1.page-title {
            font-size: 62px;
            font-weight: 700;
            color: #777777;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 22px;
        }

        /* VSCO-style profile tab bar */
        .vsco-toolbar {
            border-top: 1px solid #e6e6e6;
            padding-top: 10px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vsco-tab-wrap {
            display: inline-block;
        }

        .vsco-tab {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #222222;
            text-transform: uppercase;
            padding-bottom: 6px;
            border-bottom: 1.5px solid #222222;
        }

        .vsco-plus {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 13px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* 4-column masonry layout inside 780px */
        .vsco-masonry {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            align-items: start;
            margin-bottom: 24px;
        }

        .vsco-col {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .photo-box {
            position: relative;
            width: 100%;
            background-color: #efefef;
            border: 1px dashed #c4c4c4;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8.5px;
            font-weight: 700;
            color: #777777;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .photo-box.tall {
            height: 220px;
        }

        .photo-box.med {
            height: 156px;
        }

        .photo-box.short {
            height: 118px;
        }

        .photo-box img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        footer {
            font-size: 9px;
            color: #999999;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <nav>
            <div class="nav-left">
                <a href="index.html" data-i18n="nav_work">my work:</a>
                <a href="graphic-design.html" data-i18n="nav_graphic">graphic design</a>
                <a href="photography.html" class="active" data-i18n="nav_photo">photography</a>
                <a href="ee.html" data-i18n="nav_ee">electrical engineering</a>
                <a href="https://chudbox.us" target="_blank" rel="noopener noreferrer" data-i18n="nav_chud">CHUDbox</a>
                <a href="about.html" data-i18n="nav_about">; about me</a>
            </div>
            <div class="nav-right">
                <a href="#contact" data-i18n="nav_contact">contact</a>
                <div class="lang-switcher" aria-label="Language selector">
                    <button type="button" class="lang-btn active" data-lang="en">EN</button>
                    <span class="lang-sep">/</span>
                    <button type="button" class="lang-btn" data-lang="es">ES</button>
                    <span class="lang-sep">/</span>
                    <button type="button" class="lang-btn" data-lang="ja">日本語</button>
                </div>
            </div>
        </nav>
    </header>

    <h1 class="page-title" data-i18n="page_heading">photography</h1>

    <div class="vsco-toolbar">
        <div class="vsco-tab-wrap">
            <span class="vsco-tab" data-i18n="tab_recent">RECENT</span>
        </div>
        <button type="button" class="vsco-plus" aria-label="Add photo">+</button>
    </div>

    <section class="vsco-masonry" aria-label="Photography stream">
        <div class="vsco-col">
            <div class="photo-box tall">Photo 01</div>
            <div class="photo-box short">Photo 05</div>
        </div>
        <div class="vsco-col">
            <div class="photo-box tall">Photo 02</div>
            <div class="photo-box med">Photo 06</div>
        </div>
        <div class="vsco-col">
            <div class="photo-box tall">Photo 03</div>
            <div class="photo-box short">Photo 07</div>
        </div>
        <div class="vsco-col">
            <div class="photo-box med">Photo 04</div>
            <div class="photo-box tall">Photo 08</div>
        </div>
    </section>

    <footer id="contact">
        &copy; 2026 Christopher Morales Soriano @cemso / @kelsoitin
    </footer>
</div>

<script>
    const translations = {
        en: {
            nav_work: "my work:",
            nav_graphic: "graphic design",
            nav_photo: "photography",
            nav_ee: "electrical engineering",
            nav_chud: "CHUDbox",
            nav_about: "; about me",
            nav_contact: "contact",
            page_heading: "photography",
            tab_recent: "RECENT"
        },
        es: {
            nav_work: "mi trabajo:",
            nav_graphic: "diseño gráfico",
            nav_photo: "fotografía",
            nav_ee: "ingeniería eléctrica",
            nav_chud: "CHUDbox",
            nav_about: "; sobre mí",
            nav_contact: "contacto",
            page_heading: "fotografía",
            tab_recent: "RECIENTE"
        },
        ja: {
            nav_work: "制作実績:",
            nav_graphic: "グラフィックデザイン",
            nav_photo: "写真",
            nav_ee: "電気工学",
            nav_chud: "CHUDbox",
            nav_about: "; 自己紹介",
            nav_contact: "連絡先",
            page_heading: "写真",
            tab_recent: "最新"
        }
    };

    document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
            const lang = btn.dataset.lang;
            document.documentElement.lang = lang;
            document.querySelectorAll(".lang-btn").forEach((b) => b.classList.toggle("active", b === btn));
            document.querySelectorAll("[data-i18n]").forEach((el) => {
                const key = el.dataset.i18n;
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        });
    });
</script>

</body>
</html>
